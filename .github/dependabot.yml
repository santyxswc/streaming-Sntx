version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # vite y su plugin de React se exigen mutuamente: deben subir en el mismo PR.
      vite:
        patterns: ["vite", "@vitejs/*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init y analyze de CodeQL deben tener siempre la misma versión.
      codeql:
        patterns: ["github/codeql-action*"]

  # Imagen base del Dockerfile (se propone un nuevo digest cuando cambia).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
